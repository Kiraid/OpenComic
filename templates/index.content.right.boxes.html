{{#if boxes}}

<div class="boxes gamepad-not-outside">
	{{#each boxes}}

		<div class="box{{#if library}} library-box{{#if collapsed}} collapsed{{/if}}{{/if}}">
			{{#if library}}
			<div class="box-title box-title-toggle body-medium" onclick="dom.boxes.toggle();">{{title}}<span class="material-icon box-toggle">{{#if collapsed}}expand_more{{else}}expand_less{{/if}}</span></div>
			{{else}}
			<div class="box-title body-medium">{{title}}</div>
			{{/if}}
			<div class="box-content">
				<div class="content-view-module content-view-module-100">
					{{#each comics}}
						{{> index.content.right.module.item.html parent=..}}
					{{/each}}
				</div>
			</div>
		</div>

	{{/each}}
</div>

{{/if}}
